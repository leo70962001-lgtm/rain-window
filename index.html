<style>
/* 版面：一支直式手機的鎖定畫面。手機上滿版；寬螢幕上置中成一支手機的形狀。
   顏色：夜裡的墨藍、紙燈籠的琥珀；只有深色一種樣子（桌布本來就是夜景） */
:root {
  --ink: #0a0c11;          /* 背景（手機外） */
  --bezel: #16181e;        /* 手機邊框 */
  --paper: #efe8dc;        /* 文字：燈籠紙的白 */
  --muted: #a7a196;
  --lantern: #f2a54a;      /* 強調：燈籠 */
  --glass: rgba(16, 18, 24, 0.55);
  --glass-line: rgba(239, 232, 220, 0.14);
  --digits: "Barlow Condensed", "SF Pro Display", "Arial Narrow", sans-serif;   /* iPhone 鎖定畫面：又高又窄的大數字 */
  --ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--ink); color: var(--paper); font-family: var(--ui);
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
.stage { position: fixed; inset: 0; display: grid; place-items: center; }
.phone { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
/* 寬螢幕：做成一支手機 */
.stage.framed { padding: 24px; }
.stage.framed .phone {
  height: min(100%, 860px); width: auto; aspect-ratio: 9 / 19.5; max-width: 100%;
  border-radius: 46px; box-shadow: 0 0 0 10px var(--bezel), 0 0 0 11px #2a2d35, 0 30px 80px rgba(0,0,0,.6);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* iPhone 鎖定畫面（iOS 26，照使用者給的「7:18」截圖量的）：
   數字高 = 螢幕高 40.5%（上緣 12.5%、下緣 53%），「7:18」寬 = 螢幕寬 63%、置中；筆畫寬 ≈ 字高 5.5%；小時不補零
   冒號兩點對稱在數字中線上（間距 = 字高 42%）；日期中心在 9.8%，緊貼數字上方；沒有鎖頭
   顏色：由上往下漸層，上面半透明（看得到後面的天空）、下面亮白 */
.lock { position: absolute; inset: 0; pointer-events: none; color: rgba(255, 255, 255, .94); text-shadow: 0 2px 18px rgba(0, 0, 0, .35); }
.island { position: absolute; top: 1.5%; left: 50%; width: 31%; height: 3.5%; transform: translateX(-50%); background: #000; border-radius: 999px; display: none; }
.stage.framed .island { display: block; }
.lockIcon { display: none; }
.date { position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 8.6%); text-align: center;
  font: 700 clamp(15px, 5cqw, 21px)/1 var(--ui); letter-spacing: .02em; }
.time { position: absolute; left: 50%; width: max-content; top: calc(env(safe-area-inset-top, 0px) + 7.4%); text-align: center;
  font: 400 55.6cqw/0.8 var(--digits); letter-spacing: 0; white-space: nowrap;   /* 比例數字：iOS 的「1」是窄的（等寬數字會讓 11:07 超出畫面） */
  transform: translateX(-50%) scaleY(2.22); transform-origin: top center; text-shadow: none; filter: drop-shadow(0 2px 12px rgba(0, 0, 0, .22)); }
.time { color: transparent; }
.time span { display: inline-block; color: transparent; background: linear-gradient(to bottom, rgba(232, 244, 255, .5) 10%, rgba(244, 250, 255, .78) 55%, rgba(255, 255, 255, .97) 92%);
  -webkit-background-clip: text; background-clip: text; }
.time .colon { margin: 0 -0.03em; transform: translateY(-0.13em); }   /* 每一段自己畫漸層（父元素 background-clip:text 遇到 inline-block 子元素在 Chrome 會多畫一個冒號） */
.focus { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 6.5%); display: flex; gap: 6px; justify-content: center; align-items: center;
  font: 500 14px/1 var(--ui); color: rgba(255, 255, 255, .92); text-shadow: 0 1px 10px rgba(0, 0, 0, .5); pointer-events: none; transition: opacity .35s; }
.bar:not(.hide) ~ .focus { opacity: 0; }
.phone { container-type: inline-size; }

.bar {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 12px max(14px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 10px; align-items: center;
  transition: opacity .35s ease, transform .35s ease;
}
.bar.hide { opacity: 0; transform: translateY(12px); pointer-events: none; }
.status { font-size: 12.5px; color: var(--muted); letter-spacing: .04em; text-shadow: 0 1px 6px rgba(0,0,0,.6); text-align: center; }
.status b { color: var(--lantern); font-weight: 500; }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 100%; }
button, label.btn {
  font: 500 13px/1 var(--ui); color: var(--paper); background: var(--glass);
  border: 1px solid var(--glass-line); border-radius: 999px; padding: 10px 14px;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; min-height: 38px;
}
.phone:not([data-glass="solid"]) :is(button, label.btn, .status) { text-shadow: 0 1px 3px rgba(0, 0, 0, .55), 0 0 10px rgba(0, 0, 0, .35); }   /* 透明的玻璃按鈕在亮背景上：字要有深色光暈才讀得到 */
.phone[data-tone="light"]:not([data-glass="solid"]) :is(button, label.btn) { color: #1c2126; text-shadow: 0 0 6px rgba(255, 255, 255, .5); }   /* 淺色玻璃配深色字（iOS 淺色模式），暗版維持白字 */
.phone[data-tone="light"]:not([data-glass="solid"]) button[aria-pressed="true"] { color: #b4610c; border-color: #d98a2b; }
/* 按鈕也用同一種玻璃（跟時鐘一樣的量測值；模糊換成 CSS px：凝態 σ ≈ 0.55% 寬 → 2px、霜態 4.6% → 17px） */
.phone[data-glass="liquid"] :is(button, label.btn) { backdrop-filter: blur(1px) brightness(.93); -webkit-backdrop-filter: blur(1px) brightness(.93); background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .28); }
.phone[data-glass="frozen"] :is(button, label.btn) { backdrop-filter: blur(4px) brightness(1.1); -webkit-backdrop-filter: blur(4px) brightness(1.1); background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .3); }
.phone[data-glass="frost"] :is(button, label.btn) { backdrop-filter: blur(17px) saturate(1.15) brightness(1.1); -webkit-backdrop-filter: blur(17px) saturate(1.15) brightness(1.1); background: rgba(255, 255, 255, .18); border-color: rgba(255, 255, 255, .3); }
.phone[data-tone="dark"][data-glass="liquid"] :is(button, label.btn) { backdrop-filter: blur(1px) brightness(.7); -webkit-backdrop-filter: blur(1px) brightness(.7); background: rgba(0, 30, 40, .12); }
.phone[data-tone="dark"][data-glass="frozen"] :is(button, label.btn) { backdrop-filter: blur(4px) brightness(.75); -webkit-backdrop-filter: blur(4px) brightness(.75); background: rgba(0, 0, 0, .12); }
.phone[data-tone="dark"][data-glass="frost"] :is(button, label.btn) { backdrop-filter: blur(17px) brightness(.7); -webkit-backdrop-filter: blur(17px) brightness(.7); background: rgba(0, 0, 0, .14); }
/* 玻璃選擇面板：照參考圖排成 3 種 × 亮／暗 = 6 格，每格就是那種玻璃（backdrop-filter 用上面同樣的量測值），看得到後面的桌布
   面板本身不能有 backdrop-filter／filter：會把每格的玻璃擋在自己裡面（看不到桌布） */
.gpick { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; width: min(100%, 360px); }
.gpick .hd { font: 500 11.5px/1 var(--ui); color: rgba(255, 255, 255, .9); text-align: center; letter-spacing: .06em; text-shadow: 0 1px 6px rgba(0, 0, 0, .7); }
#gpick .sw { min-height: 0; aspect-ratio: 1.45; padding: 0; border-radius: 26%/38%; flex-direction: column; justify-content: center; gap: 3px;
  color: #fff; text-shadow: 0 1px 4px rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .34); box-shadow: 0 3px 10px rgba(0, 0, 0, .12); }
#gpick .sw b { font: 700 14px/1 var(--ui); } #gpick .sw small { font: 500 9.5px/1 var(--ui); opacity: .9; letter-spacing: .02em; }
#gpick .sw[data-g="liquid"] { backdrop-filter: blur(.5px) brightness(.93); -webkit-backdrop-filter: blur(.5px) brightness(.93); background: rgba(255, 255, 255, .04); }
#gpick .sw[data-g="frozen"] { backdrop-filter: blur(3px) brightness(1.12); -webkit-backdrop-filter: blur(3px) brightness(1.12); background: rgba(255, 255, 255, .16); }
#gpick .sw[data-g="frost"] { backdrop-filter: blur(14px) saturate(1.15) brightness(1.12); -webkit-backdrop-filter: blur(14px) saturate(1.15) brightness(1.12); background: rgba(255, 255, 255, .2); }
#gpick .sw[data-g="liquid"][data-t="dark"] { backdrop-filter: blur(.5px) brightness(.7); -webkit-backdrop-filter: blur(.5px) brightness(.7); background: rgba(0, 30, 40, .12); border-color: rgba(255, 255, 255, .4); }
#gpick .sw[data-g="frozen"][data-t="dark"] { backdrop-filter: blur(3px) brightness(.75); -webkit-backdrop-filter: blur(3px) brightness(.75); background: rgba(0, 0, 0, .12); border-color: rgba(255, 255, 255, .4); }
#gpick .sw[data-g="frost"][data-t="dark"] { backdrop-filter: blur(14px) brightness(.7); -webkit-backdrop-filter: blur(14px) brightness(.7); background: rgba(0, 0, 0, .14); border-color: rgba(255, 255, 255, .4); }
#gpick .sw[aria-pressed="true"] { outline: 2px solid var(--lantern); outline-offset: 2px; color: #fff; }
#gpick .solid { grid-column: 1 / -1; justify-self: center; }
button:focus-visible, label.btn:focus-within { outline: 2px solid var(--lantern); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--lantern); color: var(--lantern); }
button:disabled { opacity: .5; cursor: default; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lantern); }
.rec .dot { background: #e5484d; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.hint { position: absolute; left: 50%; top: 55%; transform: translate(-50%, -50%); font-size: 13px; color: var(--paper);
  background: var(--glass); border: 1px solid var(--glass-line); padding: 9px 14px; border-radius: 999px; pointer-events: none;
  transition: opacity .6s; white-space: nowrap; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.hint.gone { opacity: 0; }
@media (prefers-reduced-motion: reduce) { .bar, .hint { transition: none; } .rec .dot { animation: none; } }
</style>

<div class="stage" id="stage">

    <div class="lock" id="lock">
      <svg class="lockIcon" viewBox="0 0 24 30" aria-hidden="true"><path d="M6 13V9a6 6 0 0 1 12 0v4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><rect x="2.5" y="12.5" width="19" height="15" rx="3.5" fill="currentColor"/></svg>

<script>
"use strict";
// ============================================================
// 濕玻璃模擬（從 Unity 的 WetSurface.cs 移植；單位：公尺、秒、水膜 mm）
//   水滴：半徑 > 卡住半徑 才滑（黏住 → 突然滑 → 卡住），滑時留下小水珠、吃掉路上的水滴
//   看不到的細小水珠一直累積 → 被附近水滴吸收而長大
//   水膜：沿重力往下流 q = k·h³（下面先濕、雨停上面先乾）；變薄時破成小水珠（去濕）
// ============================================================
function hash2(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const R3 = v => Math.cbrt(Math.max(v, 0));
const V3 = r => r * r * r;
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;

class WetGlass {
  constructor(W, H) {
    this.W = W; this.H = H;
    this.maxDrops = 6000;   // 168313：每單位高度² 約 7500 顆（大多很小）
    this.slideRadius = 0.0022; this.maxSpeed = 0.12;
    this.microRate = 1e-5; this.drizzlePerM2 = 600; this.kickRate = 0.15; this.kickDepth = 0.6;   // 被推一下（小雨點、震動）就滑一小段：對照 TenMomo 影片（毛毛雨 ≈ 1.3% 在滑）與 119012、168313（1 秒內 20~32% 的水滴區域在變）
    this.spawnPerM2 = 1400;   // 畫面框住的玻璃變大（×1.6）→ 每平方公尺的量 ÷1.6²（每個畫面每秒的撞擊數跟 v17 一樣）； this.rMin = 0.0003; this.rMax = 0.0014;   // 對照 iStock「regen glas」13 支：大雨每秒新水滴、在動的數量、1 秒變化都在中位數附近   // 以 168313 為基準：小雨滴一直補上來，跟滑落掃掉的平衡在約 10 萬顆/m²（覆蓋約 20%）
    this.filmInput = 0.002; this.drainK = 3.3; this.evap = 0.001; this.wetTh = 0.05;   // filmInput：iStock 的大雨沒有整片水膜，是一層很密的水滴（之前 0.015 → 84% 變水膜）   // drainK：Nusselt 薄膜流 q = ρg·h³/(3μ) 換成這裡的單位 = 3.3（h 50 μm → 平均流速 0.8 cm/s）
    this.trailDeposit = 0.03; this.blobRadius = 0.0045; this.spread = 0.05; this.dewet = 0.15;
    this.pinCell = 0.0015; this.filmCell = 0.0012; this.gridCell = 0.004;
    this.pw = Math.ceil(W / this.pinCell) + 2; this.ph = Math.ceil(H / this.pinCell) + 2;
    this.pin = new Float32Array(this.pw * this.ph);
    const ox = Math.random() * 100, oy = Math.random() * 100, s1 = this.pinCell / 0.012, s2 = this.pinCell / 0.003;
    for (let y = 0; y < this.ph; y++) for (let x = 0; x < this.pw; x++) {
      const n1 = vnoise(ox + x * s1, oy + y * s1), n2 = vnoise(ox * 2 + x * s2, oy * 2 + y * s2);
      const spot = Math.pow(Math.max(0, n2 - 0.62) / 0.38, 2) * 1.1;
      this.pin[y * this.pw + x] = 0.85 + 0.3 * n1 + spot;          // 看不見的髒污、刮痕
    }
    this.fw = Math.ceil(W / this.filmCell); this.fh = Math.ceil(H / this.filmCell);
    const n = this.fw * this.fh;
    this.film = new Float32Array(n); this.tmp = new Float32Array(n); this.prev = new Float32Array(n);
    this.fvar = new Float32Array(n); this.wipeT = new Float32Array(n);
    this.fog = new Float32Array(n); this.fogLevel = 0.45;   // 玻璃裡面的霧（凝結）：畫面上的濃度
    // 霧的水量（g/m²）：冷凝速度 J = hm·(室內水氣 − 玻璃表面的飽和水氣)，hm ≈ 2.5 mm/s（直立窗的自然對流）
    //   室溫 20°C、玻璃被雨冷到約 10°C（露點 10°C ↔ 室內濕度約 54%）；霧的濃度 = 1 − exp(−水量 / 1 g/m²)（幾 μm 的霧珠、覆蓋約一半 ≈ 1 g/m²）
    this.fogM = new Float32Array(n); this.rh = 0.6; this.Tg = 10; this.pushV = 0;
    // 氣溫（使用者：「依照天氣的氣溫去調整霧氣」）：室溫 22°C；玻璃內側的溫度由室外氣溫決定

const SHAPE = `
void shape(float U, float b, out float T, out float m){
  float e = 1.018 + 1.072 * U + 2.049 * U * U;

let modeIdx = 0, clockOn = true, debugOn = false, weatherT = 0, last = 0, uiTimer = 0;
// 起霧、對焦（之前學的：雨窗外掛 Fog 預設 0.45；對焦在玻璃時背景失焦）
const FOG_LEVELS = [{ rh: 0.6, v: 0.12, label: "濕度 60%" }, { rh: 0.75, v: 0.45, label: "濕度 75%" }, { rh: 0.9, v: 0.8, label: "濕度 90%" }, { rh: 0.45, v: 0, label: "濕度 45%" }];   // 室內濕度 → 霧的濃度、擦掉後多快回來（45% 低於露點：擦痕會乾掉）   // 預設 0.12 = 119012 那種清楚的窗
let fogIdx = 0;
const TEMPS = [12, 5, 0, -5, -10, -20, 20, 28];   // 室外氣溫（°C）：預設 12°C（秋天的雨）；單層玻璃、室溫 22°C 時，室外約 −7°C 以下玻璃才會到零下
const degC = v => `${v < -0.5 ? "−" : ""}${Math.abs(Math.round(v))}°C`;
let tempIdx = 0;
let defogOn = false, coatOn = false;   // 除霧、防霧塗層
// 時鐘玻璃：實心（原本的白字）／液態／凝態／霜態（參考小紅書 Next Vision 的三種玻璃）
const CLOCK_GLASS = [{ kind: 1, label: "液態玻璃" }, { kind: 2, label: "凝態玻璃" }, { kind: 3, label: "霜態玻璃" }, { kind: 0, label: "實心" }];
let clockGlassIdx = 0, glassTone = 0;   // 亮版／暗版（參考圖 1/2、2/2）
function applyClockGlass() {
  const k = CLOCK_GLASS[clockGlassIdx].kind; $("phone").dataset.glass = ["solid", "liquid", "frozen", "frost"][k]; $("phone").dataset.tone = glassTone ? "dark" : "light";
  $("time").style.visibility = k > 0 ? "hidden" : "";
  $("glassBtn").textContent = k > 0 ? `玻璃：${CLOCK_GLASS[clockGlassIdx].label.slice(0, 2)}・${glassTone ? "暗" : "亮"}` : "玻璃：不用";
  for (const b of document.querySelectorAll("#gpick button")) b.setAttribute("aria-pressed", String(b.dataset.g === $("phone").dataset.glass && (k === 0 || b.dataset.t === $("phone").dataset.tone)));
  try { localStorage.setItem("rainGlass", JSON.stringify([clockGlassIdx, glassTone])); } catch (e) {} }
function pickerOpen(on) { $("gpick").hidden = !on; if (on) $("hint").classList.add("gone"); $("glassBtn").setAttribute("aria-expanded", String(on)); }
try { const g = JSON.parse(localStorage.getItem("rainGlass")); if (Array.isArray(g) && CLOCK_GLASS[g[0]]) { clockGlassIdx = g[0]; glassTone = g[1] ? 1 : 0; } } catch (e) {}   // 記住上次選的玻璃（只在這台）
const focus = { cur: 1, target: 1 };          // 1 = 對焦在玻璃、0 = 對焦在遠處的街
const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
const CLOCK_SY = 2.22;   // 數字拉高的倍數（跟 CSS 的 scaleY 一樣）
// 兩位數的小時（10~12 點）會比螢幕寬 → 跟 iPhone 一樣字高不變、整排數字變窄，最多佔螢幕寬 86%
const fitCv = document.createElement("canvas").getContext("2d");
function clockFitX(fs, txt, phoneW) {
  fitCv.font = `400 ${fs}px "Barlow Condensed", "Arial Narrow", sans-serif`;
  const m = fitCv.measureText(txt[0] + ":" + txt[1]), ink = m.actualBoundingBoxLeft + m.actualBoundingBoxRight - 0.06 * fs;
  return Math.min(1, 0.86 * phoneW / Math.max(ink, 1));
}
function clockText(d) { return [String(d.getHours() % 12 || 12), String(d.getMinutes()).padStart(2, "0")]; }
function tickClock() {
  const d = new Date();
  const [hh, mm] = clockText(d);
  const el = $("time");
  el.innerHTML = `<span>${hh}</span><span class="colon">:</span><span>${mm}</span>`;   // iPhone 預設：12 小時制、小時不補零（7:18）
  el.style.transform = `translateX(-50%) scale(${clockFitX(parseFloat(getComputedStyle(el).fontSize), [hh, mm], $("phone").clientWidth)}, ${CLOCK_SY})`;
  $("date").textContent = `${d.getMonth() + 1}月${d.getDate()}日 星期${WEEK[d.getDay()]}`;
}
function showUI() { $("bar").classList.remove("hide"); clearTimeout(uiTimer); uiTimer = setTimeout(() => { if (!recording && $("gpick").hidden) $("bar").classList.add("hide"); }, 6000); }   // 面板開著時不收起來

$("weather").addEventListener("click", () => { modeIdx = (modeIdx + 1) % MODES.length; $("weatherLabel").textContent = MODES[modeIdx].label; if (MODES[modeIdx].key === "video") { weatherT = 0; newGlass(); } showUI(); });
$("focusBtn").addEventListener("click", () => { focus.target = focus.target > 0.5 ? 0 : 1; $("focusBtn").textContent = focus.target > 0.5 ? "對焦：玻璃" : "對焦：遠處"; showUI(); });
$("tempBtn").addEventListener("click", () => { tempIdx = (tempIdx + 1) % TEMPS.length; glass.Tout = TEMPS[tempIdx]; $("tempBtn").textContent = `室外 ${degC(TEMPS[tempIdx])}`; showUI(); });
$("defogBtn").addEventListener("click", () => { defogOn = !defogOn; glass.defogOn = defogOn; $("defogBtn").setAttribute("aria-pressed", String(defogOn)); showUI(); });
$("coatBtn").addEventListener("click", () => { coatOn = !coatOn; glass.setCoat(coatOn); $("coatBtn").setAttribute("aria-pressed", String(coatOn)); showUI(); });
$("fogBtn").addEventListener("click", () => { fogIdx = (fogIdx + 1) % FOG_LEVELS.length; glass.rh = FOG_LEVELS[fogIdx].rh; $("fogBtn").textContent = FOG_LEVELS[fogIdx].label; showUI(); });
$("glassBtn").addEventListener("click", () => { pickerOpen($("gpick").hidden); showUI(); });
$("gpick").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  clockGlassIdx = CLOCK_GLASS.findIndex(c => ["solid", "liquid", "frozen", "frost"][c.kind] === b.dataset.g);
  if (b.dataset.t) glassTone = b.dataset.t === "dark" ? 1 : 0;
  applyClockGlass(); clockKey = ""; pickerOpen(false); showUI();
});
$("clockBtn").addEventListener("click", () => { clockOn = !clockOn; $("lock").hidden = !clockOn; $("clockBtn").setAttribute("aria-pressed", String(clockOn)); showUI(); });

// 換桌布：從相簿選一張；記在這個瀏覽器（下次打開還在）
const DB = "rain-window", STORE = "bg";
function idb() { return new Promise((res, rej) => { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => r.result.createObjectStore(STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function saveBg(blob) { try { const db = await idb(); db.transaction(STORE, "readwrite").objectStore(STORE).put(blob, "bg"); } catch (e) {} }
async function loadBg() { try { const db = await idb(); return await new Promise(res => { const q = db.transaction(STORE).objectStore(STORE).get("bg"); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } }
async function clearBg() { try { const db = await idb(); db.transaction(STORE, "readwrite").objectStore(STORE).delete("bg"); } catch (e) {} }
function loadImage(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; }); }
$("pick").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try { const im = await loadImage(URL.createObjectURL(f)); setBackground(im, false); saveBg(f); $("resetBg").hidden = false; } catch (err) { $("status").textContent = "這張圖片讀不出來，換一張試試"; }
  e.target.value = ""; showUI();
});
$("resetBg").addEventListener("click", async () => { try { setBackground(await loadImage("wallpaper.jpg"), true); } catch (e) {} clearBg(); $("resetBg").hidden = true; showUI(); });

// 手指擦玻璃；輕點一下 → 顯示／隱藏按鈕
let wiping = null, downAt = 0, moved = 0;
function toGlass(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * glassW, (1 - (e.clientY - r.top) / r.height) * glassH]; }
canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); wiping = toGlass(e); downAt = performance.now(); moved = 0; });
canvas.addEventListener("pointermove", e => {
  if (!wiping) return;
  const p = toGlass(e); moved += Math.hypot(p[0] - wiping[0], p[1] - wiping[1]);
  glass.wipe(wiping[0], wiping[1], p[0], p[1], 0.006 * VIEW_K); wiping = p;   // 手指在螢幕上的寬度不變
  $("hint").classList.add("gone");
});
canvas.addEventListener("pointerup", () => { if (wiping && moved >= 0.002) glass.wipeEnd(wiping[0], wiping[1]); if (wiping && moved < 0.002 && performance.now() - downAt < 350) { const b = $("bar"); if (b.classList.contains("hide")) showUI(); else { b.classList.add("hide"); pickerOpen(false); } } wiping = null; });
canvas.addEventListener("pointercancel", () => { wiping = null; });

// 存成影片：錄 12 秒（不含時鐘），可以設成動態桌布
let recording = false, downloads = null;
if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { downloads = d; if (d && window.MediaRecorder && canvas.captureStream) $("recBtn").hidden = false; });
$("recBtn").addEventListener("click", async () => {
  if (recording || !downloads) return;
  const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const type = types.find(t => MediaRecorder.isTypeSupported(t));
  if (!type) { $("status").textContent = "這個瀏覽器不能錄影"; return; }
  const ext = type.startsWith("video/mp4") ? "mp4" : "webm";
  const rec = new MediaRecorder(canvas.captureStream(30), { mimeType: type, videoBitsPerSecond: 8e6 });
  const chunks = []; rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recording = true; $("recBtn").classList.add("rec"); $("recBtn").disabled = true;
  let left = 12; $("recLabel").textContent = `錄影中 ${left}`;
  const iv = setInterval(() => { left--; $("recLabel").textContent = `錄影中 ${left}`; }, 1000);
  rec.onstop = async () => {
    clearInterval(iv); recording = false; $("recBtn").classList.remove("rec"); $("recBtn").disabled = false; $("recLabel").textContent = "存成影片";
    try { await downloads.save({ filename: `雨窓桌布.${ext}`, data: new Blob(chunks, { type }) }); $("status").textContent = "影片已存好，可以設成動態桌布"; }
    catch (err) { $("status").textContent = err && err.code === "declined" ? "沒有存影片" : "這裡不能存檔"; }
    showUI();
  };
  rec.start(500); setTimeout(() => rec.stop(), 12000);
  $("bar").classList.add("hide");
});

function frame(now) {
  const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016); last = now;
  weatherT += dt;
  const m = MODES[modeIdx];
  let rain, name, note;
  if (m.key === "auto") [rain, name, note] = autoRain(weatherT);
  else if (m.key === "video") { if (weatherT >= 53) { weatherT = 0; newGlass(); } [rain, name, note] = videoRain(weatherT); name = `影片 ${weatherT.toFixed(0)}／53 秒・${name}`; }
  else { rain = m.rain; name = m.label; note = m.key === "heavy" ? "水滴合併滑落，水膜從下面長上來" : m.key === "stop" ? "上面先乾，水膜破成一顆顆小水珠" : "小水滴慢慢合併、長大"; }
  // 零下：−15°C 以下不會下雨（會是雪）；玻璃零下時打上來的是凍雨（過冷的雨滴一碰到就凍住）
  if (glass.Tout <= -15) { rain = 0; name = "太冷了，不會下雨"; note = "這麼冷會下雪；玻璃外面的水滴都凍住了"; }
  else if (glass.glassTemp() < 0 && rain > 0) { name = "凍雨・" + name; note = "過冷的雨滴一碰到零下的玻璃就凍住，不會滑"; }
  glass.step(dt, rain);
  // 拉焦：約 3.5 秒（之前學的：拉太快會「突然糊掉、閃一下」）
  focus.cur += Math.sign(focus.target - focus.cur) * Math.min(Math.abs(focus.target - focus.cur), dt / 3.5);
  render(now / 1000, dt, rain);
  const tg = glass.glassTemp(), td = glass.dewPoint();
  const line2 = tg < 0 ? `玻璃 ${degC(tg)}・${td > 0 ? "露點 " + degC(td) : "霜點 " + degC(glass.frostPoint())}・結霜（冰花約加快 30 倍長）` : `玻璃 ${degC(tg)}・露點 ${degC(td)}・${tg < td ? "起霧" : "不起霧"}${glass.defogOn ? "・除霧中（暖風從下面吹）" : ""}`;
  if (!recording) $("status").innerHTML = `<b>${name}</b>${note ? "・" + note : ""}<br>${line2}`;   // 看得出為什麼起霧
  requestAnimationFrame(frame);
}

async function start() {
  if (!gl) { $("status").textContent = "這個瀏覽器不支援 WebGL2，看不到動態效果"; return; }
  setupGL();
  resize();
  await loadSpace();                       // 雨巷的深度、屋頂、燈（Unity 烘的）
  let img = null, isDefault = false;
  const saved = await loadBg();
  if (saved) { try { img = await loadImage(URL.createObjectURL(saved)); $("resetBg").hidden = false; } catch (e) { img = null; } }
  if (!img) { img = await loadImage("wallpaper.jpg"); isDefault = true; }
  setBackground(img, isDefault);
  // 一開始玻璃是乾的（使用者：「一開始是沒有雨在玻璃上的狀態」），雨從第 0 秒開始打上來
  tickClock(); setInterval(tickClock, 1000); applyClockGlass();
  if (document.fonts) document.fonts.ready.then(() => { clockKey = ""; });
  showUI();
  setTimeout(() => $("hint").classList.add("gone"), 5000);
  requestAnimationFrame(frame);
}
window.addEventListener("resize", () => { if (gl) resize(); });
start();
</script>
</body></html>
